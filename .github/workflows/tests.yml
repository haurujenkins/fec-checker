name: Tests de non-régression
on:
  push:
    branches: [main]
  pull_request:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save xlsx@0.18.5
      - run: node tests/regression.js
